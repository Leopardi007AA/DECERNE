name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci --ignore-scripts

      - name: Audit delle dipendenze (blocca da severità alta)
        run: npm audit --audit-level=high

      - name: Le librerie in frontend/vendor corrispondono al lockfile
        run: |
          npm run vendor
          git diff --exit-code -- frontend/vendor

      - name: Sintassi JavaScript
        run: find frontend -name '*.js' -exec node --check {} \;

      - name: vercel.json valido
        run: node -e "JSON.parse(require('fs').readFileSync('frontend/vercel.json','utf8'))"

      - name: Nessun handler inline (la CSP li blocca)
        run: |
          if grep -rnE '(^|[^-a-zA-Z])on(click|change|input|submit)="' frontend --include=*.html --include=main.js --include=legale.js; then
            echo "Trovati handler inline: usa data-onclick (vedi README)"; exit 1
          fi

      - name: Nessun segreto nel codice
        run: |
          if grep -rnEi --exclude-dir=vendor 'service_role|BREVO_API_KEY|xkeysib-' frontend; then
            echo "Possibile segreto nel codice"; exit 1
          fi